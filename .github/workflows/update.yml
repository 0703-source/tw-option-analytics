name: Refresh data and deploy

on:
  schedule:
    - cron: '7 8 * * 1-5'    # 16:07 Asia/Taipei, after TWSE close and TXO settlement
    - cron: '37 10 * * 1-5'  # 18:37 Asia/Taipei, backup in case a feed was late
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch TWSE / TAIFEX data and build the page
        run: python scripts/update.py
      - name: Test ETL, option analytics and models
        run: node scripts/test.js site/index.html 2330
      - name: Commit refreshed raw data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Data refresh $(TZ=Asia/Taipei date +%F)" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
